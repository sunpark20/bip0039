name: BIP39
options:
  bundleIdPrefix: com.sunguk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BIP39:
    type: application
    platform: iOS
    sources: [BIP39]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunguk.bip0039
        DEVELOPMENT_TEAM: GA2LMK5XL2
        INFOPLIST_FILE: BIP39/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BIP39Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [BIP39Tests]
    dependencies:
      - target: BIP39
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BIP39UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BIP39UITests]
    dependencies:
      - target: BIP39
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BIP39:
    build:
      targets:
        BIP39: all
    test:
      targets:
        - BIP39Tests
        - BIP39UITests
      gatherCoverageData: false
